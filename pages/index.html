<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenSeek Bench</title>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb;
    --card: #ffffff;
    --border: #e4e3df;
    --grid: #ececea;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a897f;
    --series-pass: #2a78d6;   /* categorical slot 1: pass@k */
    --series-tests: #eb6834;  /* categorical slot 2: test pass ratio */
    --series-tools: #1baf7a;  /* categorical slot 3: tool-call pass rate */
    --series-steps: #4a3aa7;  /* categorical slot 7: avg steps (own panel) */
    --cat-4: #eda100;
    --cat-5: #e87ba4;
    --cat-6: #008300;
    --cat-8: #e34948;
    --rail-ok: #d9d8d3;
    --status-good: #0ca30c;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface: #1a1a19;
      --card: #222221;
      --border: #3a3a38;
      --grid: #30302e;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8a897f;
      --series-pass: #3987e5;
      --series-tests: #d95926;
      --series-tools: #199e70;
      --series-steps: #9085e9;
      --cat-4: #c98500;
      --cat-5: #d55181;
      --cat-6: #008300;
      --cat-8: #e66767;
      --rail-ok: #454542;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19;
    --card: #222221;
    --border: #3a3a38;
    --grid: #30302e;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8a897f;
    --series-pass: #3987e5;
    --series-tests: #d95926;
    --series-tools: #199e70;
    --series-steps: #9085e9;
    --cat-4: #c98500;
    --cat-5: #d55181;
    --cat-6: #008300;
    --cat-8: #e66767;
    --rail-ok: #454542;
  }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--text-primary);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0; }
  .subtitle { color: var(--text-secondary); margin: 4px 0 24px; }
  .subtitle code { font-family: ui-monospace, monospace; font-size: 12px; }

  .task-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px 20px;
    margin-bottom: 24px;
  }
  .task-head { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .task-name { font-size: 16px; font-weight: 600; }
  .task-latest { color: var(--text-secondary); }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0 4px; color: var(--text-secondary); font-size: 12px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .chart-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 4px; }
  .metric-section { margin-top: 16px; }
  .metric-section > summary { cursor: pointer; font-weight: 500; padding: 4px 0; }
  select { font: inherit; color: var(--text-primary); background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; }
  .runs-body { overflow-x: auto; }
  .chart-wrap { position: relative; }
  svg { display: block; width: 100%; height: auto; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-label { fill: var(--text-muted); font-size: 11px; }
  .end-label { fill: var(--text-secondary); font-size: 11px; }
  .series-line { fill: none; stroke-width: 2; transition: opacity 0.1s; }
  .dot { stroke: var(--card); stroke-width: 2; transition: opacity 0.1s; }
  .faded { opacity: 0.12; }
  .crosshair { stroke: var(--border); stroke-width: 1; visibility: hidden; }
  .selection { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 4 3; visibility: hidden; }
  svg.pickable { cursor: pointer; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-secondary);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    visibility: hidden;
    white-space: nowrap;
    z-index: 2;
  }
  .tooltip .tt-date { color: var(--text-primary); font-weight: 600; }
  .tooltip .tt-row, .legend .tt-row { display: flex; align-items: center; gap: 6px; }

  .table-title { margin: 16px 0 4px; font-size: 12px; color: var(--text-muted); }
  a.run-link {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--text-muted);
    text-underline-offset: 2px;
  }
  a.run-link:hover { text-decoration-color: inherit; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 500; }
  th, td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--border); }
  tr.has-rail td { border-bottom: none; padding-bottom: 2px; }
  tr.rail-row td { padding: 0 12px 10px 0; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .stop { display: inline-flex; align-items: center; gap: 6px; }
  .stop-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  .empty { color: var(--text-muted); padding: 48px 0; text-align: center; }

  .rail { display: flex; gap: 1px; height: 12px; }
  .rail span {
    flex: 1 1 0;
    min-width: 1px;
    background: var(--rail-ok);
    border-radius: 1px;
    transition: opacity 0.1s;
  }
  .rail span.fail { background: var(--status-critical); }
  .rail span.dim { opacity: 0.15; }

  .tool-legend { display: flex; flex-wrap: wrap; gap: 2px 24px; margin: 4px 0 8px; }
  .tool-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; cursor: default; }
  .tool-value { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>OpenSeek Bench</h1>
  <p class="subtitle" id="subtitle">loading…</p>
  <div id="tasks"></div>
</main>

<script>
"use strict";

const STOP_COLORS = {
  finished: "var(--status-good)",
  aborted: "var(--status-critical)",
  failed: "var(--status-critical)",
  interrupted: "var(--status-serious)",
  missing: "var(--status-serious)",
};

const pct = x => `${Math.round(x * 100)}%`;
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const svgEl = (tag, attrs) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

// One chart point per task-day record.
function toPoint(rec) {
  const k = rec.runs.length;
  const mean = f => (k === 0 ? 0 : rec.runs.reduce((acc, run) => acc + f(run), 0) / k);
  const finished = rec.runs.filter(run => run.stop_reason && run.stop_reason.kind === "finished");
  let toolOk = 0, toolAll = 0;
  for (const run of rec.runs) {
    for (const s of Object.values(run.tool_call_stats)) {
      toolOk += s.passed;
      toolAll += s.passed + s.failed;
    }
  }
  return {
    date: rec.date,
    run: rec.run ?? null,
    // Keep absence intact: older records use viewer filenames without a platform.
    os: rec.os ?? null,
    target: rec.target ?? null,
    // A benchmark of a named ref rather than of openseek HEAD. It is filed
    // under the day it ran, so it sorts last and would otherwise be read as
    // the timeline's newest state -- while the commit it measured is often
    // an older one. Everywhere a point is called latest, say when it isn't.
    adhoc: rec.adhoc === true,
    commit: (rec.openseek_commit || "").slice(0, 9),
    k,
    passed: rec.passed,
    passRate: k === 0 ? 0 : rec.passed / k,
    testRatio: mean(run => {
      const t = run.test_result;
      return t.total > 0 ? t.passed / t.total : 0;
    }),
    toolRate: toolAll > 0 ? toolOk / toolAll : 0,
    // Steps only over runs that ran to completion: a run cut short by an
    // infra error (or one that looped until aborted) measures when the
    // harness stopped it, not how many steps the agent needed. No finished
    // run that day leaves a gap rather than a fake number.
    avgSteps: finished.length === 0
      ? null
      : finished.reduce((acc, run) => acc + run.steps, 0) / finished.length,
    warnings: rec.runs.reduce((acc, run) => acc + run.check_result.warnings, 0),
    runs: rec.runs,
  };
}

// Generic line+dot panel: one y-scale, crosshair, tooltip, direct end labels
// (only when few enough series to stay legible — beyond 4 the legend rules).
// A series is {get(p), color, label, id?}; a null value breaks the line, so a
// tool that made no calls that day leaves a gap instead of a fake zero.
// With onPick, clicking selects the nearest day (dashed marker, shown via
// setSelected); returns {node, setSelected}.
function chart(points, series, { height, ymax, ticks, fmt, tooltipRows, onPick, directLabels = true }) {
  const W = 880, H = height, PAD = { l: 40, r: 100, t: 12, b: 26 };
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const x = i => points.length === 1
    ? PAD.l + iw / 2
    : PAD.l + (iw * i) / (points.length - 1);
  const y = v => PAD.t + ih * (1 - v / ymax);

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (const v of ticks) {
    svg.append(svgEl("line", { x1: PAD.l, x2: W - PAD.r, y1: y(v), y2: y(v), class: "grid-line" }));
    const label = svgEl("text", { x: PAD.l - 8, y: y(v) + 4, "text-anchor": "end", class: "axis-label" });
    label.textContent = fmt(v);
    svg.append(label);
  }
  // Sparse x labels: first, last, and roughly every sixth in between.
  const step = Math.max(1, Math.ceil(points.length / 6));
  points.forEach((p, i) => {
    if (i % step !== 0 && i !== points.length - 1) return;
    const label = svgEl("text", { x: x(i), y: H - 8, "text-anchor": "middle", class: "axis-label" });
    label.textContent = p.date.slice(5);
    svg.append(label);
  });

  const selection = svgEl("line", { y1: PAD.t, y2: PAD.t + ih, class: "selection" });
  const crosshair = svgEl("line", { y1: PAD.t, y2: PAD.t + ih, class: "crosshair" });
  svg.append(selection, crosshair);

  // Direct labels at the line ends, pushed apart when lines converge.
  const lastVal = s => {
    for (let i = points.length - 1; i >= 0; i--) {
      const v = s.get(points[i]);
      if (v !== null) return v;
    }
    return null;
  };
  const direct = directLabels && series.length <= 4;
  const endY = new Map();
  if (direct) {
    const ends = series
      .map((s, i) => ({ i, v: y(lastVal(s) ?? 0) }))
      .sort((a, b) => a.v - b.v);
    for (let i = 1; i < ends.length; i++) {
      if (ends[i].v - ends[i - 1].v < 14) ends[i].v = ends[i - 1].v + 14;
    }
    for (const e of ends) endY.set(e.i, e.v);
  }

  series.forEach((s, i) => {
    let d = "";
    let pen = false;
    points.forEach((p, j) => {
      const v = s.get(p);
      if (v === null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${x(j)},${y(v)}`;
      pen = true;
    });
    if (d.includes("L")) {
      const path = svgEl("path", { d, class: "series-line", stroke: s.color });
      if (s.id) path.dataset.series = s.id;
      if (s.dash) path.setAttribute("stroke-dasharray", s.dash);
      svg.append(path);
    }
    points.forEach((p, j) => {
      const v = s.get(p);
      if (v === null) return;
      const dot = svgEl("circle", { cx: x(j), cy: y(v), r: 4, fill: s.color, class: "dot" });
      if (s.id) dot.dataset.series = s.id;
      svg.append(dot);
    });
    const end = lastVal(s);
    if (direct && end !== null) {
      const label = svgEl("text", { x: x(points.length - 1) + 10, y: endY.get(i) + 4, class: "end-label" });
      label.textContent = `${s.label} ${fmt(end)}`;
      svg.append(label);
    }
  });

  const wrap = el("div", "chart-wrap");
  const tooltip = el("div", "tooltip");
  wrap.append(svg, tooltip);

  const nearestIndex = event => {
    const rect = svg.getBoundingClientRect();
    const mx = ((event.clientX - rect.left) / rect.width) * W;
    let best = 0;
    points.forEach((_, i) => { if (Math.abs(x(i) - mx) < Math.abs(x(best) - mx)) best = i; });
    return best;
  };
  svg.addEventListener("mousemove", event => {
    const rect = svg.getBoundingClientRect();
    const best = nearestIndex(event);
    const p = points[best];
    crosshair.setAttribute("x1", x(best));
    crosshair.setAttribute("x2", x(best));
    crosshair.style.visibility = "visible";
    tooltip.replaceChildren(
      el("div", "tt-date", `${p.date} · ${p.commit}${p.adhoc ? " · ad-hoc" : ""}`),
      ...tooltipRows(p));
    tooltip.style.visibility = "visible";
    const left = (x(best) / W) * rect.width;
    tooltip.style.left = `${Math.min(left + 12, rect.width - tooltip.offsetWidth - 4)}px`;
    tooltip.style.top = "8px";
  });
  svg.addEventListener("mouseleave", () => {
    crosshair.style.visibility = "hidden";
    tooltip.style.visibility = "hidden";
  });
  if (onPick) {
    svg.classList.add("pickable");
    svg.addEventListener("click", event => onPick(nearestIndex(event)));
  }
  const setSelected = i => {
    selection.setAttribute("x1", x(i));
    selection.setAttribute("x2", x(i));
    selection.style.visibility = "visible";
  };
  return { node: wrap, setSelected };
}

function ttRow(color, text) {
  const row = el("div", "tt-row");
  const swatch = el("span", "swatch");
  swatch.style.background = color;
  row.append(swatch, document.createTextNode(text));
  return row;
}

// Viewer names include the workflow run, OS, agent target, and task so parallel
// measurements cannot overwrite each other. Older records omit OS/target, and
// the oldest omit the run number too; preserve the names originally published.
// Never fall back to another measurement's archive when an upload is missing:
// its session ids would not match. The manifest lists surviving assets after
// release GC; without a manifest (local preview), links stay on.
let VIEWERS = null;
const viewerName = (p, task) => p.run
  ? `bench-${p.date}-${p.run}-${p.os && p.target ? `${p.os}-${p.target}-` : ""}${task}.html`
  : `bench-${p.date}-${task}.html`;
const viewerHref = (p, task) => `viewer/${viewerName(p, task)}`;
const viewerExists = (p, task) =>
  VIEWERS === null || VIEWERS.has(viewerName(p, task));

// The per-run tool-call rail: one segment per call, in session order.
function rail(run) {
  const strip = el("div", "rail");
  (run.tool_calls || []).forEach((call, i) => {
    const seg = el("span", call.ok ? "" : "fail");
    seg.dataset.tool = call.tool;
    seg.title = `#${i + 1} ${call.tool}${call.ok ? "" : " · failed"}`;
    strip.append(seg);
  });
  return strip;
}

// Per-run detail for the selected day: the accessible table view.
function runTable(runs, point, task) {
  const table = el("table");
  const head = el("tr");
  for (const [name, numeric] of [["run", false], ["tests", true], ["warn", true],
    ["err", true], ["steps", true], ["elapsed", true], ["stop", false]]) {
    head.append(el("th", numeric ? "num" : "", name));
  }
  table.append(head);
  for (const run of runs) {
    const row = el("tr");
    const t = run.test_result, c = run.check_result;
    const runCell = el("td");
    const runName = run.dir.replace(/^tasks\//, "");
    if (run.session_id && viewerExists(point, task)) {
      const link = el("a", "run-link mono", runName);
      link.href = `${viewerHref(point, task)}#s=${encodeURIComponent(run.session_id)}`;
      link.target = "_blank";
      link.rel = "noopener";
      runCell.append(link);
    } else {
      runCell.append(el("span", "mono", runName));
    }
    row.append(runCell);
    row.append(el("td", "num", `${t.passed}/${t.total}`));
    row.append(el("td", "num", String(c.warnings)));
    row.append(el("td", "num", String(c.errors)));
    row.append(el("td", "num", String(run.steps)));
    row.append(el("td", "num", `${Math.round(run.elapsed)}s`));
    const kind = run.stop_reason ? run.stop_reason.kind : "missing";
    const stop = el("span", "stop");
    const dot = el("span", "stop-dot");
    dot.style.background = STOP_COLORS[kind] || "var(--text-muted)";
    stop.append(dot, document.createTextNode(kind));
    const cell = el("td");
    if (run.stop_reason && kind !== "finished") cell.title = run.stop_reason.message;
    cell.append(stop);
    row.append(cell);
    table.append(row);

    if ((run.tool_calls || []).length > 0) {
      row.className = "has-rail";
      const railRow = el("tr", "rail-row");
      const cell = el("td");
      cell.colSpan = 7;
      cell.append(rail(run));
      railRow.append(cell);
      table.append(railRow);
    }
  }
  return table;
}

// Fixed slot order from the reference palette; a tool keeps its color for the
// whole period (identity, not rank), and past eight tools only the busiest
// eight are drawn.
const TOOL_COLORS = [
  "var(--series-pass)", "var(--series-tests)", "var(--series-tools)",
  "var(--cat-4)", "var(--cat-5)", "var(--cat-6)", "var(--series-steps)",
  "var(--cat-8)",
];

// Per-day per-tool aggregate for one chart point.
function toolAgg(p) {
  const agg = new Map();
  for (const run of p.runs) {
    for (const [tool, s] of Object.entries(run.tool_call_stats)) {
      const cur = agg.get(tool) || { ok: 0, calls: 0 };
      cur.ok += s.passed;
      cur.calls += s.passed + s.failed;
      agg.set(tool, cur);
    }
  }
  return agg;
}

// Hovering a tool dims everything else: the other tools' lines and dots, and
// every non-matching segment on the run rails.
function highlightTool(card, tool) {
  for (const seg of card.querySelectorAll(".rail span")) {
    seg.classList.toggle("dim", tool !== null && seg.dataset.tool !== tool);
  }
  for (const mark of card.querySelectorAll("[data-series]")) {
    mark.classList.toggle("faded", tool !== null && mark.dataset.series !== tool);
  }
}

// Per-tool pass-rate trend: one line per tool, plus a hoverable legend row
// carrying the selected day's rate and call volume.
function toolTrend(points, card, onPick) {
  for (const p of points) p.toolsByDay = toolAgg(p);
  const totals = new Map();
  for (const p of points) {
    for (const [tool, s] of p.toolsByDay) {
      totals.set(tool, (totals.get(tool) || 0) + s.calls);
    }
  }
  const shown = [...totals.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, TOOL_COLORS.length)
    .map(entry => entry[0]);

  const series = shown.map((tool, i) => ({
    id: tool,
    label: tool,
    color: TOOL_COLORS[i],
    get: p => {
      const s = p.toolsByDay.get(tool);
      return s && s.calls > 0 ? s.ok / s.calls : null;
    },
  }));

  const legend = el("div", "tool-legend");
  const valueEls = new Map();
  shown.forEach((tool, i) => {
    const row = el("div", "tool-row");
    const swatch = el("span", "swatch");
    swatch.style.background = TOOL_COLORS[i];
    const value = el("span", "tool-value");
    valueEls.set(tool, value);
    row.append(swatch, el("span", "mono", tool), value);
    row.addEventListener("mouseenter", () => highlightTool(card, tool));
    row.addEventListener("mouseleave", () => highlightTool(card, null));
    legend.append(row);
  });

  const panel = chart(points, series, {
    height: 200,
    ymax: 1,
    ticks: [0, 0.5, 1],
    fmt: pct,
    onPick,
    tooltipRows: p => shown.flatMap((tool, i) => {
      const s = p.toolsByDay.get(tool);
      if (!s || s.calls === 0) return [];
      return [ttRow(TOOL_COLORS[i], `${tool}: ${pct(s.ok / s.calls)} (${s.calls})`)];
    }),
  });

  const wrap = el("div");
  wrap.append(legend, panel.node);
  const setSelected = i => {
    panel.setSelected(i);
    const day = points[i].toolsByDay;
    for (const [tool, value] of valueEls) {
      const s = day.get(tool);
      value.textContent = s && s.calls > 0
        ? `${pct(s.ok / s.calls)} · ${s.calls} calls`
        : "no calls";
    }
  };
  return { node: wrap, setSelected };
}

function titled(title, node) {
  const wrap = el("div");
  wrap.append(el("div", "table-title", title), node);
  return wrap;
}

// One task owns a shared timeline and one series per platform. Missing platform
// measurements remain gaps; they must never borrow another platform's result.
class TaskCard {
  constructor(task, records) {
    this.task = task;
    this.platforms = new Map();
    const timeline = new Map();
    const legacyCounts = new Map();
    for (const record of records) {
      const platform = `${record.os ?? "linux"}/${record.target ?? "native"}`;
      if (!this.platforms.has(platform)) this.platforms.set(platform, []);
      const point = toPoint(record);
      // Old records have no workflow run number. Keep multiple same-day runs
      // distinct, with an ordinal within each platform/date/commit combination.
      const base = `${record.date}/${record.openseek_commit ?? ""}`;
      const legacyKey = `${platform}/${base}`;
      const ordinal = legacyCounts.get(legacyKey) ?? 0;
      if (!record.run) legacyCounts.set(legacyKey, ordinal + 1);
      // Matrix jobs can finish on different UTC dates. The workflow run and
      // measured commit still identify the same comparison column.
      const key = record.run
        ? `run-${record.run}/${record.openseek_commit ?? ""}`
        : `${base}/legacy-${ordinal}`;
      if (!timeline.has(key)) timeline.set(key, { ...point, platforms: new Map() });
      const column = timeline.get(key);
      column.date = column.date < point.date ? column.date : point.date;
      column.platforms.set(platform, point);
      this.platforms.get(platform).push(point);
    }
    this.points = [...timeline.values()].sort((a, b) =>
      a.date.localeCompare(b.date) || Number(a.run ?? 0) - Number(b.run ?? 0));
    const colors = ["var(--series-pass)", "var(--series-tests)", "var(--series-tools)"];
    const dashes = ["", "7 4", "2 4"];
    // Stable ordering gives each platform the same color across every task,
    // including cards where one platform has not produced any data yet.
    const order = ["linux/native", "linux/wasm", "windows/native"];
    this.series = [...this.platforms.keys()].sort().map(platform => {
      const index = Math.max(0, order.indexOf(platform));
      return { label: platform, color: colors[index], dash: dashes[index] };
    });
    this.selected = this.points.length - 1;
  }

  metricChart(metric, steps = false) {
    const series = this.series.map(platform => ({
      ...platform,
      get: point => point.platforms.get(platform.label)?.[metric] ?? null,
    }));
    const max = Math.max(20, ...this.points.flatMap(point =>
      series.map(s => s.get(point) ?? 0)));
    const ymax = steps ? Math.ceil(max / 20) * 20 : 1;
    const fmt = steps ? value => String(Math.round(value)) : pct;
    return chart(this.points, series, {
      height: steps ? 150 : 210,
      ymax,
      ticks: [0, ymax / 2, ymax],
      fmt,
      directLabels: false,
      onPick: index => this.select(index),
      // A failed build produces no measurement. Keep its chart gap, but do not
      // add a placeholder row alongside the platforms that actually ran.
      tooltipRows: point => series.filter(s => point.platforms.has(s.label)).map(s => {
        const value = s.get(point);
        return ttRow(s.color, `${s.label}: ${value === null ? "no data" : fmt(value)}`);
      }),
    });
  }

  select(index) {
    this.selected = index;
    const point = this.points[index];
    const previous = this.platformSelect.value;
    // Only offer measured platforms for this run. Preserve the user's choice
    // when possible, otherwise select the first available platform.
    this.platformSelect.replaceChildren(...this.series
      .filter(s => point.platforms.has(s.label))
      .map(s => {
        const option = el("option", "", s.label);
        option.value = s.label;
        return option;
      }));
    if (point.platforms.has(previous)) this.platformSelect.value = previous;
    const platform = this.platformSelect.value;
    const detail = point.platforms.get(platform);
    for (const panel of this.charts) panel.setSelected(index);
    this.runsTitle.textContent = `runs · ${platform} · ${detail.date}` +
      (point.run ? ` · #${point.run}` : "") + (point.adhoc ? " · ad-hoc" : "");
    this.runsBody.replaceChildren(runTable(detail.runs, detail, this.task));
    this.viewer.hidden = !viewerExists(detail, this.task);
    if (!this.viewer.hidden) this.viewer.href = viewerHref(detail, this.task);
    const platformPoints = this.platforms.get(platform);
    const detailIndex = platformPoints.indexOf(detail);
    // Rebuild tool details for the newly selected platform and measurement.
    this.toolBody.replaceChildren();
    if (detailIndex >= 0) {
      const tools = toolTrend(platformPoints, this.card, i => {
        this.select(this.points.findIndex(p => p.platforms.get(platform) === platformPoints[i]));
      });
      this.toolBody.append(tools.node);
      tools.setSelected(detailIndex);
    }
  }

  render() {
    this.card = el("section", "task-card");
    const latest = this.points[this.points.length - 1];
    const head = el("div", "task-head");
    head.append(el("span", "task-name", this.task),
      el("span", "task-latest", `latest ${latest.date} · ${this.series.length} platforms`));
    this.viewer = el("a", "run-link", "sessions ↗");
    this.viewer.target = "_blank";
    this.viewer.rel = "noopener";
    head.append(this.viewer);
    const legend = el("div", "legend");
    for (const platform of this.series) legend.append(ttRow(platform.color, platform.label));

    // All metrics start expanded. Native details/summary supports keyboard
    // folding while retaining each chart and its synchronized run selection.
    const metrics = el("div");
    this.charts = [];
    for (const [metric, title] of [["passRate", "Agent pass rate (pass@k)"],
      ["testRatio", "Average tests passed"], ["toolRate", "Tool-call pass rate"],
      ["avgSteps", "Average steps · finished runs only"]]) {
      const section = el("details", "metric-section");
      section.open = true;
      const panel = this.metricChart(metric, metric === "avgSteps");
      this.charts.push(panel);
      section.append(el("summary", "", title), panel.node);
      metrics.append(section);
    }

    const platformLabel = el("label", "chart-controls", "Run details ");
    this.platformSelect = el("select");
    platformLabel.append(this.platformSelect);
    this.platformSelect.addEventListener("change", () => this.select(this.selected));
    this.runsTitle = el("div", "table-title");
    this.runsBody = el("div", "runs-body");
    this.toolBody = el("div");
    this.card.append(head, legend, metrics,
      platformLabel, this.runsTitle, this.runsBody,
      titled("tool calls · selected platform", this.toolBody));
    this.select(this.selected);
    return this.card;
  }
}

async function boot() {
  const subtitle = document.getElementById("subtitle");
  let records;
  try {
    records = await (await fetch("data.json")).json();
  } catch {
    subtitle.textContent = "failed to load data.json";
    return;
  }
  try {
    VIEWERS = new Set(await (await fetch("viewers.json")).json());
  } catch {}
  if (!Array.isArray(records) || records.length === 0) {
    subtitle.textContent = "no benchmark data yet";
    document.getElementById("tasks").append(el("div", "empty", "Stats will appear after the first daily run."));
    return;
  }
  const byTask = new Map();
  for (const rec of records) {
    if (!byTask.has(rec.task)) byTask.set(rec.task, []);
    byTask.get(rec.task).push(rec);
  }
  const last = records[records.length - 1];
  subtitle.replaceChildren(
    document.createTextNode(`daily fleet benchmark · latest ${last.date} · openseek `),
    Object.assign(el("code"), { textContent: (last.openseek_commit || "").slice(0, 9) }),
    document.createTextNode(last.adhoc === true
      ? " (ad-hoc: a named ref, not necessarily HEAD)" : ""),
  );
  const tasksRoot = document.getElementById("tasks");
  for (const [, recs] of [...byTask.entries()].sort()) {
    tasksRoot.append(new TaskCard(recs[0].task, recs).render());
  }
}
boot();
</script>
</body>
</html>
