name: bench

on:
  schedule:
    - cron: "0 10 * * *" # Runs everyday 18:00 UTC+8
  workflow_dispatch:
    inputs:
      openseek_ref:
        description: >-
          openseek commit to benchmark: a full 40-hex SHA, or a branch/tag
          name. Empty means openseek's current HEAD, which is exactly what the
          nightly schedule measures.
        required: false
        default: ""

# One benchmark per target at a time. Runs of different refs may overlap: they
# all commit to one branch, but the push loop below rebases, and each run then
# dispatches pages.yml itself. Do not "simplify" that dispatch away on the
# theory that the push triggers it -- a GITHUB_TOKEN push creates no runs.
concurrency:
  group: bench-${{ github.event.inputs.openseek_ref || 'head' }}
  cancel-in-progress: false

jobs:
  # Resolve the openseek commit under test once, so every task in the matrix
  # benchmarks the same agent even if openseek's HEAD moves mid-run. A dispatch
  # may name that commit instead, which makes the run "ad-hoc": it reports
  # without writing anything back to this repo (see the report job).
  prepare:
    runs-on: [self-hosted, macOS, ARM64]
    outputs:
      openseek_commit: ${{ steps.head.outputs.sha }}
      adhoc: ${{ steps.head.outputs.adhoc }}
      reporting: ${{ steps.gate.outputs.reporting }}
    steps:
      # Reporting commits stats to the ref this workflow was dispatched from
      # and deploys the one repository-wide Pages site, so it belongs to the
      # default branch alone. A tag cannot be pushed to without force, and a
      # feature branch would both gain a stats commit and republish the
      # production dashboard from its own snapshot -- rolling it back to
      # whatever that branch happens to hold. Off the default branch the
      # benchmark still runs and still uploads its artifacts; only reporting
      # is withheld. Which ref the workflow runs from is unrelated to the
      # commit under test: that is what openseek_ref is for.
      - name: Decide whether this run may report
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::error::cannot determine the repository's default branch"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] &&
             [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "reporting=true" >> "$GITHUB_OUTPUT"
          else
            echo "reporting=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dispatched from $GITHUB_REF_TYPE" \
                 "'$GITHUB_REF_NAME', not the default branch" \
                 "'$DEFAULT_BRANCH' -- results will stay in this run's" \
                 "artifacts and no stats will be committed or deployed."
          fi

      - name: Resolve the openseek commit under test
        id: head
        env:
          OPENSEEK_REF: ${{ github.event.inputs.openseek_ref }}
        run: |
          url=https://github.com/moonbitlang/openseek.git
          ref="${OPENSEEK_REF:-}"
          if [ -n "$ref" ]; then adhoc=true; else adhoc=false; ref=HEAD; fi
          # Resolve by fetching. It is the one form that accepts a branch, a
          # tag and a raw SHA alike -- ls-remote would hand back an annotated
          # tag's *tag object*, since its patterns match the ref tail and so
          # never match the peeled `<ref>^{}` entry, and we would then publish
          # a SHA that is not the commit the bench jobs check out. A blobless
          # single-commit fetch also proves the ref exists before six matrix
          # jobs try it.
          git init --quiet -b main resolve
          git -C resolve remote add origin "$url"
          git -C resolve fetch --quiet --depth 1 --filter=blob:none origin "$ref" || {
            echo "::error::cannot fetch openseek ref '$ref' -- pass a full" \
                 "40-hex SHA, or a branch/tag name"; exit 1; }
          sha="$(git -C resolve rev-parse "FETCH_HEAD^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "adhoc=$adhoc" >> "$GITHUB_OUTPUT"
          echo "benchmarking openseek $sha (ad-hoc: $adhoc)"

  bench:
    needs: prepare
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [csv, ini, uri, toml, hpack, protobuf]
    env:
      TASK: ${{ matrix.task }}
      OPENSEEK_COMMIT: ${{ needs.prepare.outputs.openseek_commit }}
      ADHOC: ${{ needs.prepare.outputs.adhoc }}
      # openseek is a workspace and `moon` runs the prebuild of every member,
      # including ./desktop, which imports moonbit-community/proton. proton's
      # build.mjs asks pkg-config for gtk+-3.0 and x11 on linux, so it fails
      # on the runner -- for a native link config nothing here ever uses.
      # This is proton's own switch for returning an empty config instead.
      PROTON_CEF_SETUP_BOOTSTRAP: "1"
    steps:
      - name: Require DEEPSEEK secret
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          test -n "$DEEPSEEK" || {
            echo "::error::the DEEPSEEK repository secret is not set"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Pin openseek to the commit under test
        run: |
          git -C openseek fetch --depth 1 origin "$OPENSEEK_COMMIT"
          git -C openseek checkout --quiet "$OPENSEEK_COMMIT"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit
        run: |
          moon version --all
          moon update

      - name: Build the agent
        run: |
          moon -C openseek build cmd/openseek
          moon build tools/grade

      - name: Remove private test cases
        run: rm -f tasks/"$TASK"/*_priv_test.mbt

      - name: Run the agent
        id: fleet
        continue-on-error: true
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          # Use the measured commit's resources, with an absolute path because
          # each agent runs in its own task directory. Older ad-hoc refs may
          # predate share/, so only advertise resources when they exist.
          if [ -d "$GITHUB_WORKSPACE/openseek/share" ]; then
            export OPENSEEK_REFERENCES="$GITHUB_WORKSPACE/openseek/share"
          fi
          moon -C openseek run --target native cmd/openseek -- run \
            --dir "../tasks/$TASK" \
            --concurrency 3 \
            --model deepseek-v4-flash \
            --max-steps 600 \
            "$(cat "tasks/$TASK/TASK.md")"

      - name: Restore private test cases
        run: git checkout -- "tasks/$TASK"

      - name: Grade runs
        run: |
          moon run tools/grade -- "$TASK" > grade.json
          jq --arg date "$(date -u +%F)" \
             --arg run "$GITHUB_RUN_NUMBER" \
             --argjson adhoc "$ADHOC" \
             --arg openseek_commit "$OPENSEEK_COMMIT" \
             '{date: $date, run: $run, adhoc: $adhoc,
               openseek_commit: $openseek_commit} + .' \
             grade.json | tee "stats-$TASK.json"

      - name: Export HTML
        continue-on-error: true
        run: |
          moon -C openseek build cmd/viz_app --target js
          moon -C openseek run inspect -- --search-dir ../tasks --export "../bench-$TASK.html"

      - name: Pack run directories
        run: |
          shopt -s nullglob
          dirs=(tasks/"$TASK"_run_*)
          if [ ${#dirs[@]} -gt 0 ]; then
            tar czf "runs-$TASK.tgz" \
              --exclude='_build' --exclude='.mooncakes' "${dirs[@]}"
          fi

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.task }}
          path: |
            runs-${{ matrix.task }}.tgz
            bench-${{ matrix.task }}.html
          if-no-files-found: warn
          retention-days: 90

      - name: Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: stats-${{ matrix.task }}
          path: stats-${{ matrix.task }}.json
          retention-days: 14

      - name: Fail if the fleet crashed
        if: steps.fleet.outcome == 'failure'
        run: |
          echo "::error::openseek fleet exited nonzero; partial results were still graded and uploaded"
          exit 1

  # Publishes the run, ordered by what can afford to fail: the stats commit
  # first, being the one result a finished benchmark cannot reproduce; then
  # every change to the release -- uploading this run's viewers, retiring
  # expired ones -- because the deploy downloads that release wholesale and
  # would otherwise race the deletions; then the dispatch. Runs even when a
  # task failed: a red day still records what it measured. Ad-hoc runs report
  # here too; their stats carry their own openseek_commit, so the dashboard
  # marks them and shows the ref they measured.
  report:
    needs: [prepare, bench]
    if: ${{ !cancelled() && needs.prepare.outputs.reporting == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
      actions: write
    env:
      OPENSEEK_COMMIT: ${{ needs.prepare.outputs.openseek_commit }}
      ADHOC: ${{ needs.prepare.outputs.adhoc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download stats
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: collected
          merge-multiple: true

      - name: Download session viewers
        uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          path: collected-runs
          merge-multiple: true

      - name: Merge stats and commit
        run: |
          shopt -s nullglob
          files=(collected/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no stats artifacts were produced"; exit 1
          fi
          date="$(date -u +%F)"
          out="stats/${date}-${GITHUB_RUN_NUMBER}.json"
          mkdir -p stats
          jq -s 'sort_by(.task)' "${files[@]}" > "$out"

          note=""
          [ "$ADHOC" = true ] && note=", ad-hoc"
          {
            echo "### openseek \`$OPENSEEK_COMMIT\`${note:+ · ad-hoc}"
            echo
            echo "| task | runs passed | tests per run |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.task) | \(.passed)/\(.runs | length) | " +
                         "\([.runs[] | "\(.test_result.passed)/\(.test_result.total)"]
                            | join(", ")) |"' "$out"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898203+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          # The submodule pin records which HEAD was measured, so only a HEAD
          # run may move it -- an ad-hoc run of an older ref would rewind it.
          # Its stats still land; they carry their own openseek_commit.
          if [ "$ADHOC" != true ]; then
            git -C openseek fetch --depth 1 origin "$OPENSEEK_COMMIT"
            git -C openseek checkout --quiet "$OPENSEEK_COMMIT"
            git add openseek
          fi
          # Re-running report is the documented way to finish a run that
          # committed and then failed at viewers or the deploy, and the run
          # number is stable across attempts, so the file it would write is
          # already there byte for byte. Nothing staged means the commit is
          # done, not that something went wrong.
          if git diff --cached --quiet; then
            echo "stats for run ${GITHUB_RUN_NUMBER} are already committed"
            exit 0
          fi
          git commit -m "bench: ${date} (openseek ${OPENSEEK_COMMIT:0:9}${note})"
          # Every reporting run pushes to this one branch, and runs of
          # different refs report in parallel, so a rejection just means
          # someone else got there first: rebase and go again. The old loop
          # gave up after three pushes -- and rebased a fourth time on the way
          # out, preparing a commit it then threw away. Back off between
          # attempts so a pile-up spreads out instead of colliding again.
          attempts=8
          for attempt in $(seq 1 "$attempts"); do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            [ "$attempt" -lt "$attempts" ] || break
            sleep $(( attempt * 5 ))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push stats after ${attempts} attempts"
          exit 1

      # Viewer HTML is heavy and never enters git history: it lives as assets
      # on a single rolling "viewers" release (durable, no expiry), keyed
      # bench-<date>-<run>-<task>.html — the name the dashboard links to.
      - name: Publish session viewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(collected-runs/bench-*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no viewer HTML this run"; exit 0
          fi
          gh release view viewers >/dev/null 2>&1 ||
            gh release create viewers --title "Session viewers" --latest=false \
              --notes "Standalone session-viewer archives, one asset per task-run."
          # Keyed by run number, the same key that separates the day's stats
          # files: a day can be benchmarked more than once -- the nightly plus
          # an ad-hoc ref, or a re-dispatch of an unchanged HEAD -- and each
          # measurement needs its own viewer. The commit does not separate that
          # last case; the run number separates all of them.
          #
          # The date comes from the task's own stats record, never from the
          # clock here: a matrix job that graded before UTC midnight stamped
          # yesterday into its record, and the dashboard rebuilds this name
          # from that record. Reading it back keeps the two in step, per task.
          # The date stays first: the GC step below reads it by position.
          for f in "${files[@]}"; do
            task="$(basename "$f" .html)"
            task="${task#bench-}"
            d="$(jq -r '.date' "collected/stats-${task}.json" 2>/dev/null)" || d=""
            if [ -z "$d" ] || [ "$d" = null ]; then
              echo "::warning::no stats record for $task, so its viewer has" \
                   "no date to file under -- skipping it."
              continue
            fi
            name="bench-${d}-${GITHUB_RUN_NUMBER}-${task}.html"
            cp "$f" "$name"
            gh release upload viewers "$name" --clobber
          done

      # Retire viewer assets older than 90 days — the asset name carries its
      # date, so age needs no API timestamps. The dashboard reads the manifest
      # and stops linking a day once its viewer is gone.
      - name: GC old session viewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '90 days ago' +%F)"
          gh release view viewers --json assets --jq '.assets[].name' 2>/dev/null |
          while read -r name; do
            day="${name#bench-}"
            day="${day:0:10}"
            if [[ "$day" < "$cutoff" ]]; then
              echo "retiring $name (before $cutoff)"
              gh release delete-asset viewers "$name" --yes ||
                echo "::warning::could not delete $name; another run may" \
                     "have retired it already -- the next GC will retry."
            fi
          done

      # The stats push above cannot trigger pages.yml on its own: it is
      # authenticated with GITHUB_TOKEN, and pushes made with that token create
      # no workflow runs. workflow_dispatch is one of the two events exempt
      # from that rule, so this is the only thing that can put the committed
      # stats on the dashboard before the next nightly -- which is why it runs
      # even when publishing the viewers stumbled.
      - name: Deploy the dashboard
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
