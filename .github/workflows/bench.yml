name: bench

on:
  schedule:
    - cron: "0 6 * * *" # Runs everyday 14:00 UTC+8
  workflow_dispatch:

# One benchmark at a time: overlapping runs would race on the stats commit.
concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  # Resolve the openseek commit under test once, so every task in the matrix
  # benchmarks the same agent even if openseek's HEAD moves mid-run.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      openseek_commit: ${{ steps.head.outputs.sha }}
    steps:
      - name: Resolve openseek HEAD
        id: head
        run: |
          sha="$(git ls-remote https://github.com/moonbitlang/openseek.git HEAD | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "benchmarking openseek $sha"

  bench:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        task: [csv]
    env:
      TASK: ${{ matrix.task }}
      OPENSEEK_COMMIT: ${{ needs.prepare.outputs.openseek_commit }}
    steps:
      - name: Require DEEPSEEK secret
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          test -n "$DEEPSEEK" || {
            echo "::error::the DEEPSEEK repository secret is not set"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Pin openseek to the resolved HEAD
        run: |
          git -C openseek fetch --depth 1 origin "$OPENSEEK_COMMIT"
          git -C openseek checkout --quiet "$OPENSEEK_COMMIT"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit
        run: |
          moon version --all
          moon update

      - name: Build the agent
        run: |
          (cd openseek && moon build cmd/openseek)
          moon build tools/grade

      - name: Remove private test cases
        run: rm -f tasks/"$TASK"/*_priv_test.mbt

      - name: Run the agent
        id: fleet
        continue-on-error: true
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          cd openseek
          moon run --target native cmd/openseek -- run \
            --dir "../tasks/$TASK" \
            --concurrency 3 \
            --model deepseek-v4-flash \
            --max-steps 160 \
            "$(cat "../tasks/$TASK/TASK.md")"

      - name: Restore private test cases
        run: git checkout -- "tasks/$TASK"

      - name: Grade runs
        run: |
          moon run tools/grade -- "$TASK" > grade.json
          jq --arg date "$(date -u +%F)" \
             --arg openseek_commit "$OPENSEEK_COMMIT" \
             '{date: $date, openseek_commit: $openseek_commit} + .' grade.json \
            | tee "stats-$TASK.json"

      - name: Export HTML
        continue-on-error: true
        run: |
          cd openseek
          moon build cmd/viz_app --target js
          moon run inspect -- --search-dir ../tasks --export "../bench-$TASK.html"

      - name: Pack run directories
        run: |
          shopt -s nullglob
          dirs=(tasks/"$TASK"_run_*)
          if [ ${#dirs[@]} -gt 0 ]; then
            tar czf "runs-$TASK.tgz" \
              --exclude='_build' --exclude='.mooncakes' "${dirs[@]}"
          fi

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.task }}
          path: |
            runs-${{ matrix.task }}.tgz
            bench-${{ matrix.task }}.html
          if-no-files-found: warn
          retention-days: 90

      - name: Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: stats-${{ matrix.task }}
          path: stats-${{ matrix.task }}.json
          retention-days: 14

      - name: Fail if the fleet crashed
        if: steps.fleet.outcome == 'failure'
        run: |
          echo "::error::openseek fleet exited nonzero; partial results were still graded and uploaded"
          exit 1

  # Commits the day's stats plus the tested openseek submodule pin in one
  # commit, so every stats file is attributable to an exact agent version.
  # Runs even when a task failed: a red day still records what it measured.
  report:
    needs: [prepare, bench]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      OPENSEEK_COMMIT: ${{ needs.prepare.outputs.openseek_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download stats
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: collected
          merge-multiple: true

      - name: Download session viewers
        uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          path: collected-runs
          merge-multiple: true

      - name: Merge stats and commit
        run: |
          shopt -s nullglob
          files=(collected/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no stats artifacts were produced"; exit 1
          fi
          date="$(date -u +%F)"
          out="stats/${date}-${GITHUB_RUN_NUMBER}.json"
          mkdir -p stats
          jq -s 'sort_by(.task)' "${files[@]}" > "$out"

          git -C openseek fetch --depth 1 origin "$OPENSEEK_COMMIT"
          git -C openseek checkout --quiet "$OPENSEEK_COMMIT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898203+github-actions[bot]@users.noreply.github.com'
          git add openseek "$out"
          git commit -m "bench: ${date} (openseek ${OPENSEEK_COMMIT:0:9})"
          for _ in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push stats after 3 attempts"; exit 1

      # Viewer HTML is heavy and never enters git history: it lives as assets
      # on a single rolling "viewers" release (durable, no expiry), keyed
      # bench-<date>-<task>.html — the name the dashboard links to.
      - name: Publish session viewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(collected-runs/bench-*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no viewer HTML this run"; exit 0
          fi
          date="$(date -u +%F)"
          gh release view viewers >/dev/null 2>&1 ||
            gh release create viewers --title "Session viewers" --latest=false \
              --notes "Standalone session-viewer archives, one asset per task-day."
          for f in "${files[@]}"; do
            task="$(basename "$f" .html)"
            task="${task#bench-}"
            cp "$f" "bench-${date}-${task}.html"
            gh release upload viewers "bench-${date}-${task}.html" --clobber
          done

      # Retire viewer assets older than 90 days — the asset name carries its
      # date, so age needs no API timestamps. The dashboard reads the manifest
      # below and stops linking a day once its viewer is gone.
      - name: GC old session viewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '90 days ago' +%F)"
          gh release view viewers --json assets --jq '.assets[].name' 2>/dev/null |
          while read -r name; do
            day="${name#bench-}"
            day="${day:0:10}"
            if [[ "$day" < "$cutoff" ]]; then
              echo "retiring $name (before $cutoff)"
              gh release delete-asset viewers "$name" --yes
            fi
          done

      # Publish the dashboard: the static renderer plus every committed stats
      # file (including today's) merged into one data.json, the surviving
      # session-viewer archive pulled back from the release, and a manifest of
      # which viewers exist. Requires Pages source set to "GitHub Actions".
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/viewer
          cp pages/index.html _site/
          jq -s 'flatten | sort_by(.date)' stats/*.json > _site/data.json
          gh release download viewers --dir _site/viewer \
            --pattern 'bench-*.html' || echo "no viewers published yet"
          ls _site/viewer | jq -R . | jq -s . > _site/viewers.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
