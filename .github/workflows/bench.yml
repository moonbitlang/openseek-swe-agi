name: bench

# Two schedules, two shapes of run. The whole matrix is expensive -- about 72
# CNY of DeepSeek at off-peak prices, measured from the 2026-10-30 session
# usage -- and a nightly full matrix spent ~2150 CNY a month to buy a
# resolution the data does not support: a single night's 9 trials per task
# estimate a failure rate to within about +/-14 points, so the signal only
# appears in the trend across many nights, not in any one of them.
#
# So the matrix moved to once a week, and the one cell that still earns its
# keep nightly -- ini on windows/native, the highest failure rate (21.7%) on
# the hardest platform (9.2%, about twice either linux row, p=0.002) -- runs
# as a canary on the other six nights for ~4 CNY. That keeps ini at 27 trials
# a week instead of 9, keeps a real agent call exercising the key and the
# balance daily, and costs about 14 CNY a day in all.
#
# Breakage in the toolchain or the packaging does not need paid trials to
# surface, and smoke.yml catches it nightly for nothing. Check there first
# when a weekly run comes back red.
on:
  schedule:
    # The full matrix, Saturdays 18:00 UTC+8. Saturday is off-peak all day at
    # DeepSeek (peak is 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri), so unlike
    # the old daily 10:00 UTC cron this one is not balanced on the edge of
    # the discount window.
    - cron: "0 10 * * 6"
    # The ini/windows canary, the other six nights.
    - cron: "0 10 * * 0-5"
  workflow_dispatch:
    inputs:
      openseek_ref:
        description: >-
          openseek commit to benchmark: a full 40-hex SHA, or a branch/tag
          name. Empty means openseek's current HEAD, which is exactly what the
          schedules measure.
        required: false
        default: ""
      mode:
        description: >-
          full = the whole matrix, 5 tasks x 3 platforms x 3 trials (~72 CNY).
          canary = the nightly cell only, ini on windows/native, 3 trials
          (~4 CNY).
        required: false
        type: choice
        default: full
        options: [full, canary]

# One benchmark per shape at a time. Runs of different refs may overlap: they
# all commit to one branch, but the push loop below rebases, and each run then
# dispatches pages.yml itself. Do not "simplify" that dispatch away on the
# theory that the push triggers it -- a GITHUB_TOKEN push creates no runs.
# The mode is part of the group so a Saturday full matrix and a dispatched
# canary do not queue behind each other; they touch different stats files.
concurrency:
  group: bench-${{ github.event.inputs.mode || 'sched' }}-${{ github.event.inputs.openseek_ref || 'head' }}
  cancel-in-progress: false

jobs:
  # Resolve the openseek commit under test once, so every task in the matrix
  # benchmarks the same agent even if openseek's HEAD moves mid-run. A dispatch
  # may name that commit instead, which makes the run "ad-hoc": it reports
  # without writing anything back to this repo (see the report job).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      openseek_commit: ${{ steps.head.outputs.sha }}
      adhoc: ${{ steps.head.outputs.adhoc }}
      reporting: ${{ steps.gate.outputs.reporting }}
      mode: ${{ steps.mode.outputs.mode }}
      matrix: ${{ steps.mode.outputs.matrix }}
    steps:
      - name: Decide what this run measures
        id: mode
        env:
          # Keep this in step with on.schedule above. GitHub allows no
          # expressions in `on:`, so the Saturday cron is the one unavoidable
          # duplicated string: edit both, or a Saturday quietly runs a canary.
          FULL_MATRIX_CRON: "0 10 * * 6"
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          # A dispatch says what it wants. A schedule is identified by its own
          # cron string; anything scheduled that is not the full-matrix cron is
          # a canary, so adding canary nights needs no change here.
          if [ -n "${INPUT_MODE:-}" ]; then
            mode="$INPUT_MODE"
          elif [ -z "${SCHEDULE:-}" ] || [ "$SCHEDULE" = "$FULL_MATRIX_CRON" ]; then
            mode=full
          else
            mode=canary
          fi

          # The balance floor is this shape's own cost plus headroom, not a
          # round number. The previous 100 CNY floor outlived its run cost and
          # left the benchmark dark from 2026-11-04 to 2026-11-10 on a balance
          # of 97.84 CNY -- a top-up's residue could never reach it again.
          case "$mode" in
            full)
              tasks='["csv","ini","uri","toml","hpack"]'
              platforms='[{"os":"linux","runner":"ubuntu-latest","target":"native"},
                          {"os":"linux","runner":"ubuntu-latest","target":"wasm"},
                          {"os":"windows","runner":"windows-latest","target":"native"}]'
              min_balance=85
              ;;
            canary)
              tasks='["ini"]'
              platforms='[{"os":"windows","runner":"windows-latest","target":"native"}]'
              min_balance=10
              ;;
            *)
              echo "::error::unknown mode '$mode' -- expected full or canary"
              exit 1
              ;;
          esac
          matrix="$(jq -cn --argjson task "$tasks" --argjson platform "$platforms" '{$task, $platform}')"
          {
            echo "mode=$mode"
            echo "matrix=$matrix"
            echo "min_balance=$min_balance"
          } >> "$GITHUB_OUTPUT"
          echo "mode: $mode (floor ${min_balance} CNY)"
          jq -n --argjson m "$matrix" \
            '"jobs: \($m.task | length) tasks x \($m.platform | length) platforms"'

      # Every attempt shares one DeepSeek account. When the balance runs out
      # mid-run, all attempts die on HTTP 402 together: the money already
      # spent buys no result, and the report would still commit a 0/N day to
      # the dashboard. Refuse to start below this run's budget plus headroom
      # instead; a failed prepare skips both bench and report.
      - name: Require this run's DeepSeek balance
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
          MIN_BALANCE_CNY: ${{ steps.mode.outputs.min_balance }}
        run: |
          test -n "$DEEPSEEK" || {
            echo "::error::the DEEPSEEK repository secret is not set"; exit 1; }
          body="$(curl -fsS --retry 3 --max-time 30 \
                    -H "Authorization: Bearer $DEEPSEEK" \
                    https://api.deepseek.com/user/balance)" || {
            echo "::error::cannot query the DeepSeek balance"; exit 1; }
          available="$(jq -r '.is_available' <<<"$body")"
          balance="$(jq -r '[.balance_infos[]? | select(.currency == "CNY")
                             | .total_balance | tonumber] | add // 0' <<<"$body")"
          echo "DeepSeek balance: $balance CNY (available: $available)"
          if [ "$available" != true ] ||
             ! awk -v b="$balance" -v m="$MIN_BALANCE_CNY" 'BEGIN { exit !(b >= m) }'; then
            echo "::error::DeepSeek balance is $balance CNY, below the" \
                 "$MIN_BALANCE_CNY CNY this run needs -- top up before" \
                 "re-running. Nothing was benchmarked or reported."
            exit 1
          fi

      # Reporting commits stats to the ref this workflow was dispatched from
      # and deploys the one repository-wide Pages site, so it belongs to the
      # default branch alone. A tag cannot be pushed to without force, and a
      # feature branch would both gain a stats commit and republish the
      # production dashboard from its own snapshot -- rolling it back to
      # whatever that branch happens to hold. Off the default branch the
      # benchmark still runs and still uploads its artifacts; only reporting
      # is withheld. Which ref the workflow runs from is unrelated to the
      # commit under test: that is what openseek_ref is for.
      - name: Decide whether this run may report
        id: gate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "${DEFAULT_BRANCH:-}" ]; then
            echo "::error::cannot determine the repository's default branch"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] &&
             [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "reporting=true" >> "$GITHUB_OUTPUT"
          else
            echo "reporting=false" >> "$GITHUB_OUTPUT"
            echo "::warning::dispatched from $GITHUB_REF_TYPE" \
                 "'$GITHUB_REF_NAME', not the default branch" \
                 "'$DEFAULT_BRANCH' -- results will stay in this run's" \
                 "artifacts and no stats will be committed or deployed."
          fi

      - name: Resolve the openseek commit under test
        id: head
        env:
          OPENSEEK_REF: ${{ github.event.inputs.openseek_ref }}
        run: |
          url=https://github.com/moonbitlang/openseek.git
          ref="${OPENSEEK_REF:-}"
          if [ -n "$ref" ]; then adhoc=true; else adhoc=false; ref=HEAD; fi
          # Resolve by fetching. It is the one form that accepts a branch, a
          # tag and a raw SHA alike -- ls-remote would hand back an annotated
          # tag's *tag object*, since its patterns match the ref tail and so
          # never match the peeled `<ref>^{}` entry, and we would then publish
          # a SHA that is not the commit the bench jobs check out. A blobless
          # single-commit fetch also proves the ref exists before the matrix
          # jobs try it.
          git init --quiet -b main resolve
          git -C resolve remote add origin "$url"
          git -C resolve fetch --quiet --depth 1 --filter=blob:none origin "$ref" || {
            echo "::error::cannot fetch openseek ref '$ref' -- pass a full" \
                 "40-hex SHA, or a branch/tag name"; exit 1; }
          sha="$(git -C resolve rev-parse "FETCH_HEAD^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "adhoc=$adhoc" >> "$GITHUB_OUTPUT"
          echo "benchmarking openseek $sha (ad-hoc: $adhoc)"

  bench:
    needs: prepare
    name: bench (${{ matrix.platform.os }}, ${{ matrix.platform.target }}, ${{ matrix.task }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 300
    permissions:
      contents: read
    defaults:
      run:
        # Git Bash keeps the benchmark and grading commands the same on Windows.
        shell: bash
    strategy:
      fail-fast: false
      # Decided in prepare, because the shape depends on the mode: the weekly
      # full matrix is 5 tasks x 3 platforms, the nightly canary is ini on
      # windows/native alone. protobuf stays in tasks/ but is in neither: it
      # passed all 228 trials from 2026-09-17 to 2026-10-30, so it no longer
      # separates agent revisions, yet cost ~14 CNY a night.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TASK: ${{ matrix.task }}
      BENCH_OS: ${{ matrix.platform.os }}
      BENCH_TARGET: ${{ matrix.platform.target }}
      BENCH_KEY: ${{ matrix.platform.os }}-${{ matrix.platform.target }}-${{ matrix.task }}
      OPENSEEK_COMMIT: ${{ needs.prepare.outputs.openseek_commit }}
      ADHOC: ${{ needs.prepare.outputs.adhoc }}
      # Skip Proton's CEF setup for CLI-only benchmarks. This switch does not
      # cover proton_tray's independent GTK prebuild; the composite action
      # installs its Linux build dependencies even though the agent itself
      # does not use the tray.
      PROTON_CEF_SETUP_BOOTSTRAP: "1"
    steps:
      - name: Require DEEPSEEK secret
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          test -n "$DEEPSEEK" || {
            echo "::error::the DEEPSEEK repository secret is not set"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      # Toolchain, build, staging and the bundled-workflow check. Shared with
      # smoke.yml so the free nightly run exercises exactly this path; none of
      # it contacts a model.
      - name: Build and package the agent
        uses: ./.github/actions/build-agent
        with:
          openseek-commit: ${{ needs.prepare.outputs.openseek_commit }}
          target: ${{ matrix.platform.target }}

      - name: Record the bundle manifest
        run: cp "$RUNNER_TEMP/openseek-agent/bundle.json" "bundle-$BENCH_KEY.json"

      - name: Remove private test cases
        run: rm -f tasks/"$TASK"/*_priv_test.mbt

      - name: Run the agent
        id: fleet
        continue-on-error: true
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK }}
        run: |
          agent="$OPENSEEK_AGENT"
          if [ "$RUNNER_OS" = Windows ]; then
            agent="$(cygpath -u "$agent")"
          fi
          command=("$agent")
          if [ "$BENCH_TARGET" = wasm ]; then
            command=(moonrun "$agent" --)
          fi
          task="$(cat "tasks/$TASK/TASK.md")"
          # Preserve the previous moon -C working directory, but launch the
          # installed artifact directly so the build tree is no longer involved.
          cd openseek
          # openseek dropped fleet mode (`run --concurrency`), so launch the
          # attempts here the way it did: each works in its own copy of the
          # task at tasks/<task>_run_<i> and records its own session there,
          # which is the layout tools/grade reads. A single run exits nonzero
          # unless its turn finished; like the fleet, fail only when no
          # attempt did.
          pids=()
          for i in 1 2 3; do
            run_dir="../tasks/${TASK}_run_$i"
            rm -rf "$run_dir"
            cp -R "../tasks/$TASK" "$run_dir"
            ( "${command[@]}" run \
                --dir "$run_dir" \
                --model deepseek-v4-flash \
                --max-steps 600 \
                "$task" 2>&1 >/dev/null | sed -u "s/^/[run $i] /" ) &
            pids+=("$!")
          done
          completed=0
          for pid in "${pids[@]}"; do
            if wait "$pid"; then completed=$((completed + 1)); fi
          done
          echo "$completed/${#pids[@]} attempts completed"
          [ "$completed" -gt 0 ]

      - name: Restore private test cases
        run: git checkout -- "tasks/$TASK"

      - name: Grade runs
        run: |
          moon run tools/grade --target wasm -- "$TASK" > grade.json
          jq --arg date "$(date -u +%F)" \
             --arg run "$GITHUB_RUN_NUMBER" \
             --arg os "$BENCH_OS" \
             --arg target "$BENCH_TARGET" \
             --argjson adhoc "$ADHOC" \
             --arg openseek_commit "$OPENSEEK_COMMIT" \
             '{date: $date, run: $run, adhoc: $adhoc, os: $os, target: $target,
               openseek_commit: $openseek_commit} + .' \
             grade.json | tee "stats-$BENCH_KEY.json"

      - name: Export HTML
        continue-on-error: true
        run: |
          moon -C openseek build cmd/viz_app --target js
          moon -C openseek run inspect --target native -- --search-dir ../tasks --export "../bench-$BENCH_KEY.html"

      - name: Pack run directories
        run: |
          shopt -s nullglob
          dirs=(tasks/"$TASK"_run_*)
          if [ ${#dirs[@]} -gt 0 ]; then
            tar --exclude='_build' --exclude='.mooncakes' \
              -czf "runs-$BENCH_KEY.tgz" "${dirs[@]}"
          fi

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ env.BENCH_KEY }}
          path: |
            runs-${{ env.BENCH_KEY }}.tgz
            bench-${{ env.BENCH_KEY }}.html
            bundle-${{ env.BENCH_KEY }}.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: stats-${{ env.BENCH_KEY }}
          path: stats-${{ env.BENCH_KEY }}.json
          retention-days: 14

      - name: Fail if no attempt completed
        if: steps.fleet.outcome == 'failure'
        run: |
          echo "::error::no openseek attempt completed; partial results were still graded and uploaded"
          exit 1

  # Publishes the run, ordered by what can afford to fail: the stats commit
  # first, being the one result a finished benchmark cannot reproduce; then
  # every change to the release -- uploading this run's viewers, retiring
  # expired ones -- because the deploy downloads that release wholesale and
  # would otherwise race the deletions; then the dispatch. Runs even when a
  # task failed: a red day still records what it measured. Ad-hoc runs report
  # here too; their stats carry their own openseek_commit, so the dashboard
  # marks them and shows the ref they measured. A canary run reports the same
  # way, with one record instead of fifteen -- the dashboard already draws a
  # missing measurement as a gap rather than a zero.
  report:
    needs: [prepare, bench]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.reporting == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      OPENSEEK_COMMIT: ${{ needs.prepare.outputs.openseek_commit }}
      ADHOC: ${{ needs.prepare.outputs.adhoc }}
      MODE: ${{ needs.prepare.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download stats
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          path: collected
          merge-multiple: true

      - name: Download session viewers
        uses: actions/download-artifact@v4
        with:
          pattern: runs-*
          path: collected-runs
          merge-multiple: true

      - name: Merge stats and commit
        run: |
          shopt -s nullglob
          files=(collected/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no stats artifacts were produced"; exit 1
          fi
          date="$(date -u +%F)"
          out="stats/${date}-${GITHUB_RUN_NUMBER}.json"
          mkdir -p stats
          jq -s 'sort_by([.os, .target, .task])' "${files[@]}" > "$out"

          note=""
          [ "$ADHOC" = true ] && note=", ad-hoc"
          {
            echo "### openseek \`$OPENSEEK_COMMIT\` · $MODE${note:+ · ad-hoc}"
            echo
            echo "| OS | agent target | task | runs passed | tests per run |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.[] | "| \(.os) | \(.target) | \(.task) | \(.passed)/\(.runs | length) | " +
                         "\([.runs[] | "\(.test_result.passed)/\(.test_result.total)"]
                            | join(", ")) |"' "$out"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name 'github-actions[bot]'
          git config user.email '41898203+github-actions[bot]@users.noreply.github.com'
          git add "$out"
          # The submodule pin records which HEAD was measured, so only a HEAD
          # run of the full matrix may move it -- an ad-hoc run of an older ref
          # would rewind it, and a canary measured one cell of it. Their stats
          # still land; they carry their own openseek_commit.
          if [ "$ADHOC" != true ] && [ "$MODE" = full ]; then
            git -C openseek fetch --depth 1 origin "$OPENSEEK_COMMIT"
            git -C openseek checkout --quiet "$OPENSEEK_COMMIT"
            git add openseek
          fi
          # Re-running report is the documented way to finish a run that
          # committed and then failed at viewers or the deploy, and the run
          # number is stable across attempts, so the file it would write is
          # already there byte for byte. Nothing staged means the commit is
          # done, not that something went wrong.
          if git diff --cached --quiet; then
            echo "stats for run ${GITHUB_RUN_NUMBER} are already committed"
            exit 0
          fi
          git commit -m "bench: ${date} (openseek ${OPENSEEK_COMMIT:0:9}, ${MODE}${note})"
          # Every reporting run pushes to this one branch, and runs of
          # different refs report in parallel, so a rejection just means
          # someone else got there first: rebase and go again. The old loop
          # gave up after three pushes -- and rebased a fourth time on the way
          # out, preparing a commit it then threw away. Back off between
          # attempts so a pile-up spreads out instead of colliding again.
          attempts=8
          for attempt in $(seq 1 "$attempts"); do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            [ "$attempt" -lt "$attempts" ] || break
            sleep $(( attempt * 5 ))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push stats after ${attempts} attempts"
          exit 1

      # Viewer HTML is heavy and never enters git history: it lives as assets
      # on a single rolling "viewers" release (durable, no expiry), keyed
      # bench-<date>-<run>-<os>-<target>-<task>.html — the dashboard's key.
      - name: Publish session viewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(collected-runs/bench-*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no viewer HTML this run"; exit 0
          fi
          gh release view viewers >/dev/null 2>&1 ||
            gh release create viewers --title "Session viewers" --latest=false \
              --notes "Standalone session-viewer archives, one asset per task-run."
          # Keyed by run number, the same key that separates the day's stats
          # files: a day can be benchmarked more than once -- the weekly matrix
          # plus an ad-hoc ref, or a re-dispatch of an unchanged HEAD -- and
          # each measurement needs its own viewer. The commit does not separate
          # that last case; the run number separates all of them.
          #
          # The date comes from the task's own stats record, never from the
          # clock here: a matrix job that graded before UTC midnight stamped
          # yesterday into its record, and the dashboard rebuilds this name
          # from that record. Reading it back keeps the two in step, per task.
          # The date stays first: the GC step below reads it by position.
          for f in "${files[@]}"; do
            key="$(basename "$f" .html)"
            key="${key#bench-}"
            d="$(jq -r '.date' "collected/stats-${key}.json" 2>/dev/null)" || d=""
            if [ -z "$d" ] || [ "$d" = null ]; then
              echo "::warning::no stats record for $key, so its viewer has" \
                   "no date to file under -- skipping it."
              continue
            fi
            name="bench-${d}-${GITHUB_RUN_NUMBER}-${key}.html"
            cp "$f" "$name"
            gh release upload viewers "$name" --clobber
          done

      # Retire viewer assets older than 90 days — the asset name carries its
      # date, so age needs no API timestamps. The dashboard reads the manifest
      # and stops linking a day once its viewer is gone.
      - name: GC old session viewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '90 days ago' +%F)"
          gh release view viewers --json assets --jq '.assets[].name' 2>/dev/null |
          while read -r name; do
            day="${name#bench-}"
            day="${day:0:10}"
            if [[ "$day" < "$cutoff" ]]; then
              echo "retiring $name (before $cutoff)"
              gh release delete-asset viewers "$name" --yes ||
                echo "::warning::could not delete $name; another run may" \
                     "have retired it already -- the next GC will retry."
            fi
          done

      # The stats push above cannot trigger pages.yml on its own: it is
      # authenticated with GITHUB_TOKEN, and pushes made with that token create
      # no workflow runs. workflow_dispatch is one of the two events exempt
      # from that rule, so this is the only thing that can put the committed
      # stats on the dashboard before the next scheduled run -- which is why it
      # runs even when publishing the viewers stumbled.
      - name: Deploy the dashboard
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
